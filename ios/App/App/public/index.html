<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>鲸语</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="description" content="鲸语 · 和大肥鱼私聊的液态玻璃聊天室" />
    <meta name="theme-color" content="#eef5ff" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="鲸语" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <script src="/js/theme-boot.js"></script>
    <link rel="stylesheet" href="/styles/tokens.css" />
    <link rel="stylesheet" href="/styles/glass.css" />
    <link rel="stylesheet" href="/styles/app.css" />
  </head>
  <body>
    <div class="ambient" aria-hidden="true">
      <div class="ambient__blobs"></div>
      <div class="ambient__grain"></div>
    </div>

    <div id="app">
      <div class="shell" id="shell">
        <div class="shell__viewport" id="viewport"></div>
        <nav class="tabbar" id="tabbar" aria-label="主导航" hidden></nav>
      </div>
    </div>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <div class="sheet-layer" id="sheet-layer">
      <div class="sheet-backdrop"></div>
      <div class="sheet glass glass--strong" id="sheet" role="dialog" aria-modal="true"></div>
    </div>

    <noscript>鲸语需要开启 JavaScript 才能使用。</noscript>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
