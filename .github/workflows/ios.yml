name: Build unsigned IPA

# 在 GitHub 的 macOS 机器上打出未签名 .ipa，下载后用 Sideloadly / AltStore 自签安装。
# 不需要 Apple 开发者账号；没有 Mac 也能出包。

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'App 要连接的服务器地址（例如 https://chat.example.com）'
        required: true
        type: string
      app_name:
        description: '桌面显示的名字'
        required: false
        default: '鲸语'
        type: string

jobs:
  build:
    runs-on: macos-13
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 写入服务器地址
        run: node scripts/ios-config.mjs --url "${{ inputs.server_url }}" --app-name "${{ inputs.app_name }}"

      - name: 同步网页资源到 iOS 工程
        run: npx cap copy ios

      - name: 构建（未签名）
        run: |
          set -o pipefail
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tail -n 80

      - name: 打包成 .ipa
        run: |
          set -euo pipefail
          cd ios/App
          APP="build/Build/Products/Release-iphoneos/App.app"
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry WhaleTalk-unsigned.ipa Payload
          ls -lh WhaleTalk-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: WhaleTalk-unsigned-ipa
          path: ios/App/WhaleTalk-unsigned.ipa
          retention-days: 14
