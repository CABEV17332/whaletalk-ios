name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 语法检查
        run: |
          for f in server/*.mjs tools/*.mjs scripts/*.mjs web/js/*.js web/js/views/*.js; do
            node --check "$f"
          done
      - name: 端到端测试
        run: node --test tests/api.test.mjs
